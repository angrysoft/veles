---
# Wybór menedżera pakietów dla dystrybucji opartych na RPM z zypperem
backend: zypp

# Określa, czy przerywać/pomijać operacje na paczkach w przypadku braku sieci
skip_if_no_internet: false

# Lista operacji do wykonania na systemie docelowym (targetenv)
operations:
  - remove:
      - calamares
      - veles-calamares-config
      - dracut-kiwi-live
      - grub2
      - grub2-x86_64-efi
