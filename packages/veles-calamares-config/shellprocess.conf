script:
    - "/usr/bin/rm -f /etc/polkit-1/rules.d/49-calamares.rules"
    - "/usr/bin/rm -f /etc/systemd/system/getty@tty1.service.d/override.conf"
    - "/usr/bin/rmdir /etc/systemd/system/getty@tty1.service.d"
    - "/usr/bin/systemctl daemon-reload"
    - "/usr/bin/systemctl enable greetd.service"
    - "/usr/bin/zypper --non-interactive remove -u veles-calamares-config calamares dracut-kiwi-live grub2 grub2-x86_64-efi"