[main]
font=JetBrains Mono:size=11:style=Regular
# Turn on bold and italic according to the font settings
font-bold=JetBrains Mono:size=11:style=Bold
font-italic=JetBrains Mono:size=11:style=Italic
# Store selection in the primary clipboard, not the system clipboard
selection-target=primary
include=/etc/xdg/foot/foot-colors.ini
pad=12x12

[colors-dark]
alpha=0.95

[cursor]
style=block
blink=yes
blink-rate=750


[mouse-bindings]
select-extend-character-wise=none
primary-paste=BTN_MIDDLE
select-extend=none
clipboard-copy = BTN_RIGHT